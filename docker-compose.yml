services:
  postgres:
    image: postgres:17-alpine
    container_name: host-elite-postgres-dev
    restart: always
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=hostelite_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d hostelite_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:latest
    container_name: host-elite-valkey-dev
    restart: always
    command: valkey-server --requirepass admin123
    ports:
      - '6379:6379'
    volumes:
      - valkey_data:/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: host-elite-pgadmin-dev
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
  valkey_data:
